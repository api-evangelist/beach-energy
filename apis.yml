description: Beach Energy is an ASX-listed oil and natural gas exploration and production company headquartered in Adelaide, South Australia, with operations in the Cooper Basin, Perth Basin, Bass Basin, Otway Basin and Taranaki Basin (New Zealand). Its public website, beachenergy.com.au, covers its operations, key projects (such as Waitsia Gas Project Stage 2 and Moomba CCS), investor information, sustainability reporting and media releases, and it runs a community engagement site at engage.beachenergy.com.au. No public developer portal or API documentation was found on its own site.

